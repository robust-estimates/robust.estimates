  "/applications/{applicationId}":
    get:
      tags:
      - Заявки
      summary: Текущий статус и следующее действие
      operationId: getApplicationsApplicationid
      description: CLIENT видит только свои заявки. Опрос во время обработки каждые
        2 секунды. nextAction содержит понятное клиенту описание.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Application"
          headers:
