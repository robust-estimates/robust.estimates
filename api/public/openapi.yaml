      description: Только EMPLOYEE. Только MANUAL_CHECK. NEEDS_INFO требует непустой
        requestedFields. APPROVED/ALTERNATIVE требуют непустые offers; REJECTED требует
        пустые offers. Сервер проверяет условия продукта и публикует решение через
        CHECKED; действия записываются в аудит.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Application"
          headers:
            ETag:
              description: Версия заявки в двойных кавычках
              schema:
                type: string
                example: '"3"'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Объект не найден или недоступен
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Конфликт версии, ключа идемпотентности или статуса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Данные не прошли проверку
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: ''
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Повтор с тем же ключом и телом возвращает исходный результат;
          другое тело — 409. Хранение 24 часа в рамках пользователя и операции.
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          example: '"3"'
        description: Версия из ETag / Application.version в двойных кавычках. Устаревшая
          версия — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ManualDecision"
  "/feed":
    get:
      tags:
      - Лента
      summary: Персонализированная лента внутри кабинета
      operationId: getFeed
      description: Новости и следующие действия по компании и заявкам текущего клиента.
        После изменения статуса состав ленты меняется; reason объясняет персонализацию.
        Поле applicationId необязательно для общих новостей.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/FeedItem"
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Объект не найден или недоступен
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Конфликт версии, ключа идемпотентности или статуса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Данные не прошли проверку
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: INVALID_STATE
        message:
          type: string
          example: Действие недоступно в текущем статусе
        traceId:
          type: string
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - code
      - message
      - traceId
    Status:
      type: string
      enum:
      - IN_PROGRESS
      - SCORING
      - MANUAL_CHECK
      - NEEDS_INFO
      - CHECKED
      - APPROVED
      - ALTERNATIVE
      - REJECTED
      - ACCEPTED
      - DECLINED
      - ISSUED
      - CANCELLED
    Credentials:
      type: object
      additionalProperties: false
      properties:
        login:
          type: string
        password:
          type: string
          format: password
      required:
      - login
      - password
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - CLIENT
          - EMPLOYEE
      required:
      - accessToken
      - tokenType
      - expiresIn
      - role
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - CLIENT
          - EMPLOYEE
        companyIds:
          type: array
          items:
            type: string
      required:
      - id
      - displayName
      - role
      - companyIds
    CompanyInput:
      type: object
      additionalProperties: false
      properties:
        inn:
          type: string
          pattern: "^(\\d{10}|\\d{12})$"
          example: '7700000000'
        name:
          type: string
          minLength: 1
        businessAgeMonths:
          type: integer
          minimum: 0
        monthlyRevenueMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        monthlyExpensesMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        monthlyDebtPaymentsMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
      required:
      - inn
      - name
      - businessAgeMonths
      - monthlyRevenueMinor
      - monthlyExpensesMinor
      - monthlyDebtPaymentsMinor
    Company:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        inn:
          type: string
          pattern: "^(\\d{10}|\\d{12})$"
          example: '7700000000'
        name:
          type: string
          minLength: 1
        businessAgeMonths:
          type: integer
          minimum: 0
        monthlyRevenueMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        monthlyExpensesMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        monthlyDebtPaymentsMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        verificationStatus:
          type: string
          enum:
          - NOT_CHECKED
          - VERIFIED
          - FAILED
        verificationMessage:
          type: string
      required:
      - id
      - inn
      - name
      - businessAgeMonths
      - monthlyRevenueMinor
      - monthlyExpensesMinor
      - monthlyDebtPaymentsMinor
      - verificationStatus
    Need:
      type: object
      additionalProperties: false
      properties:
        companyId:
          type: string
        amountMinor:
          type: integer
          minimum: 10000000
          maximum: 5000000000
        termMonths:
          type: integer
          minimum: 1
          maximum: 60
        purpose:
          type: string
          enum:
          - WORKING_CAPITAL
          - EQUIPMENT
          - BUSINESS_EXPANSION
        description:
          type: string
          maxLength: 2000
      required:
      - companyId
      - amountMinor
      - termMonths
      - purpose
    Product:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        purposes:
          type: array
          items:
            type: string
            enum:
            - WORKING_CAPITAL
            - EQUIPMENT
            - BUSINESS_EXPANSION
        minAmountMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        maxAmountMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        minTermMonths:
          type: integer
          minimum: 1
        maxTermMonths:
          type: integer
          minimum: 1
        annualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        requiredDocumentTypes:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - purposes
      - minAmountMinor
      - maxAmountMinor
      - minTermMonths
      - maxTermMonths
      - annualRateBps
      - requiredDocumentTypes
    Recommendation:
      type: object
      additionalProperties: false
      properties:
        product:
          "$ref": "#/components/schemas/Product"
        reason:
          type: string
        estimatedMonthlyPaymentMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
      required:
      - product
      - reason
      - estimatedMonthlyPaymentMinor
    Consent:
      type: object
      additionalProperties: false
      properties:
        personalDataProcessing:
          type: boolean
          enum:
          - true
        creditHistoryCheck:
          type: boolean
          enum:
          - true
      required:
      - personalDataProcessing
      - creditHistoryCheck
    DraftInput:
      type: object
      additionalProperties: false
      properties:
        need:
          "$ref": "#/components/schemas/Need"
        productId:
          type: string
        consents:
          "$ref": "#/components/schemas/Consent"
      required:
      - need
      - productId
      - consents
    DraftPatch:
      type: object
      additionalProperties: false
      properties:
        need:
          "$ref": "#/components/schemas/Need"
        productId:
          type: string
        consents:
          "$ref": "#/components/schemas/Consent"
    Application:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        companyId:
          type: string
        productId:
          type: string
        need:
          "$ref": "#/components/schemas/Need"
        consents:
          "$ref": "#/components/schemas/Consent"
        status:
          "$ref": "#/components/schemas/Status"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nextAction:
          type: string
        missingFields:
          type: array
          items:
            type: string
      required:
      - id
      - companyId
      - productId
      - need
      - status
      - version
      - createdAt
      - updatedAt
      - nextAction
    Document:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        applicationId:
          type: string
        type:
          type: string
          enum:
          - FINANCIAL_REPORT
          - BANK_STATEMENT
          - REGISTRATION
          - OTHER
        fileName:
          type: string
        contentType:
          type: string
          enum:
          - application/pdf
          - image/png
          - image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        status:
          type: string
          enum:
          - UPLOADED
          - VERIFIED
          - REJECTED
      required:
      - id
      - applicationId
      - type
      - fileName
      - contentType
      - sizeBytes
      - status
    Validation:
      type: object
      additionalProperties: false
      properties:
        valid:
          type: boolean
        missingFields:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - valid
      - missingFields
      - errors
    Check:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum:
          - FNS_MOCK
          - BKI_MOCK
          - INTERNAL_RULES
        status:
          type: string
          enum:
          - PENDING
          - PASSED
          - FAILED
          - UNAVAILABLE
        summary:
          type: string
        checkedAt:
          type: string
          format: date-time
      required:
      - source
      - status
      - summary
    Scoring:
      type: object
      additionalProperties: false
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 1000
        riskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        factors:
          type: array
          items:
            type: string
        modelVersion:
          type: string
          example: rules-v1
        checks:
          type: array
          items:
            "$ref": "#/components/schemas/Check"
      required:
      - score
      - riskLevel
      - factors
      - modelVersion
      - checks
    Offer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        productId:
          type: string
        amountMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        termMonths:
          type: integer
          minimum: 1
          maximum: 60
        annualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        monthlyPaymentMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - productId
      - amountMinor
      - termMonths
      - annualRateBps
      - monthlyPaymentMinor
      - expiresAt
    Decision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        outcome:
          type: string
          enum:
          - APPROVED
          - ALTERNATIVE
          - REJECTED
        reason:
          type: string
        offers:
          type: array
          items:
            "$ref": "#/components/schemas/Offer"
        decidedAt:
          type: string
          format: date-time
      required:
      - id
      - outcome
      - reason
      - offers
      - decidedAt
    ManualDecision:
      type: object
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum:
          - APPROVED
          - ALTERNATIVE
          - REJECTED
          - NEEDS_INFO
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        offers:
          type: array
          items:
            "$ref": "#/components/schemas/Offer"
        requestedFields:
          type: array
          items:
            type: string
      required:
      - outcome
      - reason
    Event:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        fromStatus:
          "$ref": "#/components/schemas/Status"
        toStatus:
          "$ref": "#/components/schemas/Status"
        message:
          type: string
        actorRole:
          type: string
          enum:
          - CLIENT
          - EMPLOYEE
          - SYSTEM
      required:
      - id
      - at
      - toStatus
      - message
      - actorRole
    Loan:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        applicationId:
          type: string
        offerId:
          type: string
        amountMinor:
          type: integer
          minimum: 0
          maximum: 100000000000
        issuedAt:
          type: string
          format: date-time
        simulated:
          type: boolean
          enum:
          - true
      required:
      - id
      - applicationId
      - offerId
      - amountMinor
      - issuedAt
      - simulated
    FeedItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        applicationId:
          type: string
      required:
      - id
      - title
      - body
      - reason
      - createdAt
    PageApplications:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Application"
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - offset
      - limit
      - total
