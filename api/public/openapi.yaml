        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден или недоступен
          content:
            application/json:
              schema:
