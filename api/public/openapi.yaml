      summary: Прикрепить документ
      operationId: postApplicationsApplicationidDocuments
      description: Только IN_PROGRESS или NEEDS_INFO. PDF/PNG/JPEG, до 10 МиБ; сервер
        проверяет содержимое и тип. Новая версия заявки доступна через GET.
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Document"
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Объект не найден или недоступен
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Конфликт версии, ключа идемпотентности или статуса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Данные не прошли проверку
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: Файл больше 10 МиБ
        '415':
          description: Недопустимый тип файла
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: ''
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Повтор с тем же ключом и телом возвращает исходный результат;
          другое тело — 409. Хранение 24 часа в рамках пользователя и операции.
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          example: '"3"'
        description: Версия из ETag / Application.version в двойных кавычках. Устаревшая
          версия — 409.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
