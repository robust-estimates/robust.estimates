          minLength: 8
          maxLength: 128
        description: Повтор с тем же ключом и телом возвращает исходный результат;
          другое тело — 409. Хранение 24 часа в рамках пользователя и операции.
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          example: '"3"'
        description: Версия из ETag / Application.version в двойных кавычках. Устаревшая
          версия — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DraftPatch"
  "/applications/{applicationId}/documents":
