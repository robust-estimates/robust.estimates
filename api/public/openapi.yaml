      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Повтор с тем же ключом и телом возвращает исходный результат; другое тело — 409.
          Хранение 24 часа в рамках пользователя и операции.
