    patch:
      tags:
      - Заявки
      summary: Дополнить или исправить заявку
      operationId: patchApplicationsApplicationid
      description: Только IN_PROGRESS или NEEDS_INFO. need заменяется целиком. При
        смене компании документы нужно загрузить заново; после первой отправки компания
        неизменяема.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Application"
          headers:
            ETag:
              description: Версия заявки в двойных кавычках
              schema:
                type: string
                example: '"3"'
        '400':
          description: Некорректный запрос
