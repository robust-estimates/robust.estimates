  /auth/register:
    post:
      tags:
      - Вход
      summary: Зарегистрировать клиента
      operationId: postAuthRegister
      description: 'Публичная регистрация по email без подтверждения почты в MVP. Создаёт только CLIENT;
        выбор роли запрещён. Сохраняет bcrypt-хеш пароля и возвращает JWT на один час. Idempotency-Key
        не требуется: повтор email возвращает 409. Ограничение: 20 попыток в минуту на IP, отдельно от
        входа.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Клиент создан, сессия открыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSession'
        '400':
          description: Некорректный JSON или неизвестное поле, включая role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Тело запроса больше 8 КиБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Некорректные email, имя или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышена частота регистрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: INVALID_STATE
        message:
          type: string
          example: Действие недоступно в текущем статусе
        traceId:
          type: string
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - code
      - message
      - traceId
    Status:
      type: string
      enum:
      - IN_PROGRESS
      - SCORING
      - MANUAL_CHECK
      - NEEDS_INFO
      - CHECKED
      - APPROVED
      - ALTERNATIVE
      - REJECTED
      - ACCEPTED
      - DECLINED
      - ISSUED
      - CANCELLED
    Credentials:
      type: object
      additionalProperties: false
      properties:
        login:
          type: string
        password:
          type: string
          format: password
      required:
      - login
      - password
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - CLIENT
          - EMPLOYEE
      required:
      - accessToken
      - tokenType
      - expiresIn
      - role
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - CLIENT
          - EMPLOYEE
        companyIds:
          type: array
          items:
            type: string
      required:
      - id
      - displayName
      - role
      - companyIds
    CompanyInput:
      type: object
      additionalProperties: false
      properties:
        inn:
          type: string
          pattern: ^(\d{10}|\d{12})$
          example: '7700000000'
        name:
          type: string
          minLength: 1
        businessAgeMonths:
          type: integer
          minimum: 0
          maximum: 2400
        monthlyRevenueMinor:
          type: integer
          minimum: 0
          maximum: 10000000000000
        monthlyExpensesMinor:
          type: integer
          minimum: 0
          maximum: 10000000000000
        monthlyDebtPaymentsMinor:
          type: integer
          minimum: 0
          maximum: 10000000000000
        kpp:
          type: string
        ogrn:
          type: string
        industry:
          type: string
        registeredAt:
          type: string
        representativeName:
          type: string
        representativePosition:
          type: string
        phone:
          type: string
        email:
          type: string
        annualRevenueMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000000
        annualExpensesMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000000
        outstandingDebtMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000000
        cashFlowMinor:
          type: integer
          format: int64
          minimum: -100000000000000
          maximum: 100000000000000
        hasOverdueDebt:
          type: boolean
        marketplaceSales:
          type: boolean
      required:
      - inn
      - name
      - businessAgeMonths
      - monthlyRevenueMinor
      - monthlyExpensesMinor
      - monthlyDebtPaymentsMinor
    Company:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        inn:
          type: string
          pattern: ^(\d{10}|\d{12})$
          example: '7700000000'
        name:
          type: string
          minLength: 1
        businessAgeMonths:
          type: integer
          minimum: 0
          maximum: 2400
        monthlyRevenueMinor:
          type: integer
          minimum: 0
          maximum: 10000000000000
        monthlyExpensesMinor:
          type: integer
          minimum: 0
          maximum: 10000000000000
        monthlyDebtPaymentsMinor:
          type: integer
          minimum: 0
          maximum: 10000000000000
        verificationStatus:
          type: string
          enum:
          - NOT_CHECKED
          - VERIFIED
          - FAILED
        verificationMessage:
          type: string
        kpp:
          type: string
        ogrn:
          type: string
        industry:
          type: string
        registeredAt:
          type: string
        representativeName:
          type: string
        representativePosition:
          type: string
        phone:
          type: string
        email:
          type: string
        annualRevenueMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000000
        annualExpensesMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000000
        outstandingDebtMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000000
        cashFlowMinor:
          type: integer
          format: int64
          minimum: -100000000000000
          maximum: 100000000000000
        hasOverdueDebt:
          type: boolean
        marketplaceSales:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - id
      - inn
      - name
      - businessAgeMonths
      - monthlyRevenueMinor
      - monthlyExpensesMinor
      - monthlyDebtPaymentsMinor
      - verificationStatus
    Need:
      type: object
      additionalProperties: false
      properties:
        companyId:
          type: string
        amountMinor:
          type: integer
          minimum: 10000000
          maximum: 50000000000
        termMonths:
          type: integer
          minimum: 1
          maximum: 180
        purpose:
          type: string
          enum: &id001
          - WORKING_CAPITAL
          - BUSINESS_EXPANSION
          - EQUIPMENT
          - REAL_ESTATE
          - REFINANCING
          - SELLERS
          - OTHER
        description:
          type: string
          maxLength: 2000
      required:
      - companyId
      - amountMinor
      - termMonths
      - purpose
    Product:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        purposes:
          type: array
