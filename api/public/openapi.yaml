openapi: 3.0.3
info:
  title: Умный кредитный кабинет предпринимателя
  version: 1.2.0
  description: 'Работающий учебный backend robust.estimates. REST на gateway, gRPC между сервисами. Деньги
    — копейки RUB, ставки — базисные пункты. ФНС/БКИ, скоринг rules-v1, подписание и выдача моделируются
    локально. Авторизация: тестовые учётные записи. Команды используют Idempotency-Key, изменение заявки
    — If-Match.'
servers:
- url: http://localhost:8080/api/v1
  description: Локальный Docker Compose
tags:
- name: Вход
- name: Компания
- name: Подбор
- name: Заявки
- name: Документы
- name: Результат
- name: Банк
- name: Лента
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Вход
      summary: Войти в кабинет
      operationId: postAuthLogin
      description: Демонстрационные учётные записи из README. JWT действует один час; для продления требуется
        новый вход.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Некорректный JSON или неизвестные поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден или недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт версии, ключа идемпотентности или статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Данные не прошли проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком много попыток входа
        '413':
          description: Тело запроса больше 8 КиБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      security: []
  /me:
    get:
      tags:
      - Вход
      summary: Текущий пользователь
      operationId: getMe
      description: ''
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
