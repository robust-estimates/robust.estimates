        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Объект не найден или недоступен
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Конфликт версии, ключа идемпотентности или статуса
          content:
            application/json:
