name: robust-estimates
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      COMPANY_DB_PASSWORD: ${COMPANY_DB_PASSWORD:?required}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  database-init:
    image: postgres:17.6-bookworm
    entrypoint: [bash, /bootstrap/001_databases.sh]
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      COMPANY_DB_PASSWORD: ${COMPANY_DB_PASSWORD:?required}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
    volumes:
      - ./deploy/postgres/init:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  storage-init:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    command: [init-storage]
    environment:
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: credit-documents
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
  company-service:
    build:
      context: .
      dockerfile: company-service/Dockerfile
    environment:
      DATABASE_URL: postgres://company_user:${COMPANY_DB_PASSWORD:?required}@postgres:5432/company_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?required}
      GRPC_ADDR: :9091
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  scoring:
    build:
      context: .
      dockerfile: scoring/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?required}
      GRPC_ADDR: '[::]:9093'
      SCORING_MODEL: ${SCORING_MODEL:-model-v1}
    healthcheck:
      test: [CMD, python, -m, app.server, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  external-mocks:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    healthcheck:
      test: [CMD, python, server.py, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  application-service:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    environment:
      DATABASE_URL: postgres://application_user:${APPLICATION_DB_PASSWORD:?required}@postgres:5432/application_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?required}
      GRPC_ADDR: :9092
      COMPANY_GRPC_ADDR: company-service:9091
      SCORING_GRPC_ADDR: scoring:9093
      EXTERNAL_MOCKS_URL: http://external-mocks:8090
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: credit-documents
    depends_on:
      database-init:
        condition: service_completed_successfully
      company-service:
        condition: service_healthy
      scoring:
        condition: service_healthy
      external-mocks:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD:?required}@postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?required}
      SEED_DEMO: 'true'
      HTTP_ADDR: :8080
      COMPANY_GRPC_ADDR: company-service:9091
      APPLICATION_GRPC_ADDR: application-service:9092
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      database-init:
        condition: service_completed_successfully
      company-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
