name: backend
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - run: go test -race ./platform/... ./company-service/... ./application-service/... ./gateway/...
      - run: go vet ./platform/... ./company-service/... ./application-service/... ./gateway/...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scoring/requirements.txt
      - run: PYTHONPATH=generated:. python -m unittest discover -s tests
        working-directory: scoring
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r scripts/requirements-test.txt
      - run: python scripts/validate_contract.py
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: CHECK_CONTRACT=1 python3 scripts/e2e.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
